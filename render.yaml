services:
  - type: cron
    name: anil-x-autopilot
    runtime: node
    schedule: '*/5 * * * *'
    buildCommand: 'true'
    startCommand: 'node -e "fetch(\"https://city-of-eternity.onrender.com/api/autopilot\",{method:\"POST\"}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
    plan: free

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="description" content="ANIL X — خواسته‌ات را بگو، مسیر انجامش را پیدا کن.">
<link rel="stylesheet" href="style.css">
<title>ANIL X — فقط بگو چی می‌خوای</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#caa34a"></head>
<body>
<div class="scene" aria-hidden="true"><div class="orb orb1"></div><div class="orb orb2"></div><div class="halo"></div><div class="grid"></div></div>
<header class="topbar">
  <a class="brand" href="#top"><span class="xmark">X</span><span>ANIL X</span></a>
  <a class="manage" href="admin.html">مدیریت</a>
</header>
<main id="top">
<section class="hero">
  <div class="signal"><span></span><span></span><span></span></div>
  <div class="kicker">ANIL X ENGINE</div>
  <h1>هر چیزی که می‌خوای<br><strong>بگو.</strong></h1>
  <p class="sub">لازم نیست بدونی اسمش چیه یا چطور باید انجام بشه.<br>فقط خواسته‌ات رو بگو؛ ما مسیرش رو پیدا می‌کنیم.</p>
  <form id="requestForm" class="composer" novalidate>
    <div class="composer-top"><span class="live-dot"></span><span>من گوش می‌دم...</span></div>
    <label class="sr-only" for="requestInput">چی می‌خواهید انجام دهید؟</label>
    <textarea id="requestInput" rows="2" maxlength="1000" placeholder="مثلاً برای مغازه‌م یه سایت می‌خوام..." autocomplete="off"></textarea>
    <div class="composer-bottom"><div class="tools"><button type="button" class="tool voice" id="voiceBtn" aria-pressed="false"><span>◉</span> بگو</button><label class="tool" for="imageInput"><span>＋</span> عکس / فایل</label><input id="imageInput" type="file" accept="image/*" capture="environment" hidden></div><button class="go" type="submit"><span>مسیرش رو پیدا کن</span><b>↗</b></button></div>
    <div id="voiceStatus" class="status" hidden aria-live="polite"></div><div id="imagePreview" class="image-preview" hidden></div><div class="count" id="charCount">۰ / ۱۰۰۰</div>
  </form>
  <div class="ideas"><span>مثلاً</span><button data-request="یه سایت برای کسب‌وکارم می‌خوام">یه سایت می‌خوام</button><button data-request="یه تیزر برای محصولم می‌خوام">یه تیزر می‌خوام</button><button data-request="سایتم خراب شده و باید درستش کنم">یه چیزی خراب شده</button><button data-request="می‌خوام مشتری بیشتری پیدا کنم">می‌خوام رشد کنم</button></div>
  <div id="routeResult" class="route-result" hidden aria-live="polite"></div>
</section>
<section class="promise" id="how"><span>خواسته</span><i>→</i><span>فهمیدن</span><i>→</i><span>ساختن</span><i>→</i><strong>نتیجه</strong></section>
</main><footer><span>ANIL X STUDIO</span><span>از خواسته تا نتیجه · خلیج فارس</span></footer>
<script src="script.js" defer></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script></body></html>

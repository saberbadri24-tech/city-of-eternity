name: ANIL X Growth CI

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "ANIL-X-*.md"
      - "ANIL-X-AUTONOMY-POLICY.json"
      - "package.json"
      - ".github/workflows/anilx-growth-ci.yml"
  pull_request:
    paths:
      - "functions/**"
      - "ANIL-X-*.md"
      - "ANIL-X-AUTONOMY-POLICY.json"
      - "package.json"
      - ".github/workflows/anilx-growth-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle-check Netlify functions
        run: |
          mkdir -p .ci-build
          npx --yes esbuild functions/anilx-growth-heartbeat.mts functions/anilx-growth-health.mts functions/anilx-growth-daily.mts --platform=node --format=esm --bundle --external:@netlify/blobs --outdir=.ci-build
      - name: Validate autonomy policy
        run: |
          node -e "const p=require('./ANIL-X-AUTONOMY-POLICY.json'); if(p.autonomy.production_code_mutation||p.autonomy.payment_execution||p.autonomy.secret_rotation||p.autonomy.dns_changes) process.exit(1); console.log('safe autonomy policy: OK')"
      - name: Validate package
        run: node -e "JSON.parse(require('fs').readFileSync('package.json')); console.log('package.json: OK')"

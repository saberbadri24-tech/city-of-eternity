name: Keep ANIL X warm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production health
        run: |
          curl --fail --silent --show-error --max-time 20 https://anil-x-live.onrender.com/api/health >/dev/null
          curl --fail --silent --show-error --max-time 20 https://anil-x-live.onrender.com/ >/dev/null
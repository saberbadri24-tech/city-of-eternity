name: Immortal Guard — Continuous Radar
# Durable store authentication is delegated to the Supabase JWT gate.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: immortal-guard-radar
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
      TON_MAIN_WALLET: ${{ secrets.TON_MAIN_WALLET }}
      GUARD_RUNTIME_FINAL: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Checkout standalone Immortal Guard source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: saberbadri24-tech/immortal-guard
          ref: main
          path: external-immortal-guard
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Runtime heartbeat
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path("guard-status.json")
          d=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          d["heartbeatAt"]=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Discovery
        run: python scripts/global_opportunity_discovery.py
      - name: Official-source discovery
        run: python scripts/official_discovery.py
      - name: Discovery verification
        run: python scripts/verify_global_discovery.py
      - name: Strict free-real-token hunter
        run: python scripts/free_real_token_engine.py
      - name: Airdrop+ intelligence scan
        run: python scripts/airdrop_guard.py
      - name: Safe no-signature claim lane
        run: python scripts/guard_safe_claim_engine.py
      - name: Source health
        run: python scripts/guard_source_health.py
      - name: Opportunity intelligence
        run: python scripts/opportunity_intelligence.py
      - name: High-value opportunity engine
        run: python scripts/high_value_opportunity_engine.py
      - name: TON receipt monitor
        run: python scripts/guard_ton_receipts.py
      - name: Materialize Guard wallet policy state
        run: python scripts/guard_wallet_runtime.py
      - name: Materialize Guard capability policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("guard-capabilities.json").write_text(json.dumps({
            "selfModificationPolicy":"PROPOSE_ONLY",
            "ownerApprovalRequired":True,
            "automaticClaim":False,
            "automaticSigning":False,
            "automaticTransfer":False,
            "privateKeyAccess":False,
            "seedPhraseAccess":False
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Threat engine
        run: python scripts/guard_threat_engine.py
      - name: Evidence ledger
        run: python scripts/guard_evidence_ledger.py
      - name: Anomaly engine
        run: python scripts/guard_anomaly_engine.py
      - name: Replay engine
        run: python scripts/guard_replay_engine.py
      - name: Workflow security
        run: python scripts/guard_workflow_security.py
      - name: Materialize Guard agent contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          denied=["SIGN_WALLET","TRANSFER_ASSETS","BYPASS_KYC","BYPASS_CAPTCHA","AUTO_CLAIM","CHANGE_POLICY","EXPORT_SECRETS"]
          agents=[
            {"id":"discovery","trust":"VERIFIED_READONLY","canAct":False,"capabilities":["DISCOVER","READ_PUBLIC"],"deniedCapabilities":denied},
            {"id":"verification","trust":"VERIFIED_READONLY","canAct":False,"capabilities":["VERIFY","READ_PUBLIC"],"deniedCapabilities":denied},
            {"id":"radar","trust":"VERIFIED_READONLY","canAct":False,"capabilities":["RANK","READ_PUBLIC"],"deniedCapabilities":denied},
            {"id":"planner","trust":"OWNER_APPROVED","canAct":True,"capabilities":["PROPOSE_ACTION","READ_EVIDENCE"],"deniedCapabilities":denied}
          ]
          Path("guard-agent-contract.json").write_text(json.dumps({"policy":"FAIL_CLOSED","agents":agents},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Agent contract
        run: python scripts/guard_agent_contract.py
      - name: Evolution engine
        run: python scripts/guard_evolution_engine.py
      - name: Horizon engine
        run: python scripts/guard_horizon_engine.py
      - name: Modular core
        run: python scripts/guard_modular_core.py
      - name: Action planner
        run: python scripts/guard_action_planner.py
      - name: Unified Immortal Guard orchestration
        run: python scripts/guard_unified_orchestrator.py
      - name: Super Radar regression
        run: |
          python -m py_compile scripts/guard_super_radar.py scripts/test_guard_super_radar.py
          python scripts/test_guard_super_radar.py
      - name: Super Airdrop / Immortal Guard fusion
        run: python scripts/guard_super_radar.py
      - name: Materialize Guard unlock-value state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("guard-unlock-value.json").write_text(json.dumps({
            "status":"ready",
            "source":"guard_unlock_value_engine",
            "ownerApprovalRequired":True,
            "automaticAction":False,
            "potentialValueUsd":0,
            "targetGapUsd":0
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Materialize Guard future-signals state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("guard-future-signals.json").write_text(json.dumps({
            "items":[],
            "action":"never-auto-claim",
            "executionGate":"OWNER_APPROVAL_REQUIRED"
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Final fail-closed preflight
        run: python scripts/guard_final_preflight.py

      - name: Assert fresh Guard heartbeat
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          d=json.loads(Path("guard-status.json").read_text(encoding="utf-8"))
          t=d.get("lastScan") or d.get("updatedAt") or d.get("heartbeatAt")
          if not t: raise SystemExit("Guard freshness timestamp missing")
          age=(datetime.now(timezone.utc)-datetime.fromisoformat(t.replace("Z","+00:00"))).total_seconds()/60
          if age>15: raise SystemExit(f"Guard state is stale: {age:.1f} minutes")
          print(f"Guard freshness PASS: {age:.1f} minutes")
          PY

      - name: Prepare private Guard snapshot
        env:
          ANIL_X_RENDER_URL: https://anil-x-live.onrender.com
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(name):
              try: return json.loads(Path(name).read_text(encoding='utf-8'))
              except Exception: return {}
          payload={
            'status':read('guard-status.json'),
            'opportunities':read('guard-opportunities.json'),
            'highValue':read('guard-high-value.json'),
            'sourceHealth':read('guard-source-health.json'),
            'capabilities':read('guard-capabilities.json'),
            'radar':read('guard-super-radar.json'),
            'receipts':read('guard-receipts.json'),
            'official':read('guard-official-discovery.json'),
            'ledger':read('guard-evidence-ledger.json'),
            # Independent Guard is the canonical source for owner-review candidates.
            'externalStatus':read('external-immortal-guard/data/guard_status.json'),
            'ownerQueue':read('external-immortal-guard/data/owner_review_queue.json'),
            'externalAI':read('external-immortal-guard/data/ai_reviews.json'),
            'externalReceipts':read('external-immortal-guard/data/ton_receipts.json'),
            'externalIncome':read('external-immortal-guard/data/income_pipeline.json')
          }
          # Bound each document as valid JSON; never truncate the serialized
          # aggregate, which could cut a JSON token and make the ingest body invalid.
          def bounded(value, limit=3500):
              raw=json.dumps(value,ensure_ascii=False,separators=(',',':'))
              if len(raw)<=limit:
                  return value
              if isinstance(value,dict):
                  out={}
                  for k,v in value.items():
                      candidate=dict(out)
                      candidate[k]=bounded(v,max(512,limit//4))
                      if len(json.dumps(candidate,ensure_ascii=False,separators=(',',':')))<=limit:
                          out=candidate
                  return out
              if isinstance(value,list):
                  out=[]
                  for item in value:
                      candidate=out+[item]
                      if len(json.dumps(candidate,ensure_ascii=False,separators=(',',':'))) > limit:
                          break
                      out=candidate
                  return out
              return str(value)[:max(0,limit-64)]
          payload={k:bounded(v) for k,v in payload.items()}
          Path('/tmp/anil-guard-ingest.json').write_text(
              json.dumps(payload,ensure_ascii=False,separators=(',',':')),
              encoding='utf-8'
          )
          PY
          OIDC_TOKEN="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")"
          python - "$OIDC_TOKEN" <<'PY'
          import base64,json,sys,urllib.request
          token=sys.argv[1]
          h,p,s=token.split('.')
          dec=lambda x:base64.urlsafe_b64decode(x+'='*((4-len(x)%4)%4))
          header=json.loads(dec(h)); claims=json.loads(dec(p))
          print(json.dumps({'header':{k:header.get(k) for k in ('alg','kid','typ')},'claims':{k:claims.get(k) for k in ('iss','aud','repository','ref','exp','iat')}},ensure_ascii=False))
          jwks=json.load(urllib.request.urlopen('https://token.actions.githubusercontent.com/.well-known/jwks',timeout=20))
          assert any(k.get('kid')==header.get('kid') for k in jwks.get('keys',[])), 'GitHub OIDC signing key not published'
          PY
          python -m pip install -q cryptography
          python - "$OIDC_TOKEN" <<'PY'
          import base64,json,sys,urllib.request
          from cryptography.hazmat.primitives.asymmetric import rsa,padding
          from cryptography.hazmat.primitives import hashes
          token=sys.argv[1]; h,p,s=token.split('.')
          dec=lambda x:base64.urlsafe_b64decode(x+'='*((4-len(x)%4)%4))
          header=json.loads(dec(h))
          jwks=json.load(urllib.request.urlopen('https://token.actions.githubusercontent.com/.well-known/jwks',timeout=20))
          jwk=next(k for k in jwks['keys'] if k['kid']==header['kid'])
          n=int.from_bytes(dec(jwk['n']),'big'); e=int.from_bytes(dec(jwk['e']),'big')
          key=rsa.RSAPublicNumbers(e,n).public_key()
          key.verify(dec(s),(h+'.'+p).encode(),padding.PKCS1v15(),hashes.SHA256())
          print('GitHub OIDC RSA signature PASS')
          PY
          HTTP_CODE="$(curl -sS -o /tmp/anil-guard-ingest-response.json -w "%{http_code}" -X POST "$ANIL_X_RENDER_URL/api/guard/ingest" \
            -H "X-ANIL-OIDC-Token: $OIDC_TOKEN" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "X-ANIL-OIDC-Audience: anil-x" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/anil-guard-ingest.json)"
          cat /tmp/anil-guard-ingest-response.json
          test "$HTTP_CODE" = "200"
          rm -f /tmp/anil-guard-ingest.json /tmp/anil-guard-ingest-response.json

      - name: Confirm no public Guard state is committed
        run: echo "Guard detailed state stays in private Render Owner storage; GitHub receives no Guard JSON state."

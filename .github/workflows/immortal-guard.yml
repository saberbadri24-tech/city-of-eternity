name: Immortal Guard — Continuous Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "guard-*.json"
      - "rewards.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: immortal-guard-radar
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
      TON_MAIN_WALLET: ${{ secrets.TON_MAIN_WALLET }}
      GUARD_RUNTIME_FINAL: "1"

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Discovery
        run: python scripts/global_opportunity_discovery.py

      - name: Official-source discovery
        run: python scripts/official_discovery.py

      - name: Discovery verification
        run: python scripts/verify_global_discovery.py

      - name: Strict free-real-token hunter
        run: python scripts/free_real_token_engine.py

      - name: Airdrop+ intelligence scan
        run: python scripts/airdrop_guard.py

      - name: Safe no-signature claim lane
        run: python scripts/guard_safe_claim_engine.py

      - name: Source health
        run: python scripts/guard_source_health.py

      - name: Opportunity intelligence
        run: python scripts/opportunity_intelligence.py

      - name: High-value opportunity engine
        run: python scripts/high_value_opportunity_engine.py

      - name: TON receipt monitor
        run: python scripts/guard_ton_receipts.py

      - name: Threat engine
        run: python scripts/guard_threat_engine.py

      - name: Evidence ledger
        run: python scripts/guard_evidence_ledger.py

      - name: Anomaly engine
        run: python scripts/guard_anomaly_engine.py

      - name: Replay engine
        run: python scripts/guard_replay_engine.py

      - name: Workflow security
        run: python scripts/guard_workflow_security.py

      - name: Agent contract
        run: python scripts/guard_agent_contract.py

      - name: Evolution engine
        run: python scripts/guard_evolution_engine.py

      - name: Horizon engine
        run: python scripts/guard_horizon_engine.py

      - name: Modular core
        run: python scripts/guard_modular_core.py

      - name: Action planner
        run: python scripts/guard_action_planner.py

      - name: Super Radar regression
        run: |
          python -m py_compile scripts/guard_super_radar.py scripts/test_guard_super_radar.py
          python scripts/test_guard_super_radar.py

      - name: Super Airdrop / Immortal Guard fusion
        run: python scripts/guard_super_radar.py

      - name: Final fail-closed preflight
        run: python scripts/guard_final_preflight.py

      - name: Build lightweight live summary for Render
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def read(name):
              try: return json.loads(Path(name).read_text(encoding='utf-8'))
              except Exception: return {}
          status=read('guard-status.json')
          radar=read('guard-super-radar.json')
          ledger=read('guard-evidence-ledger.json')
          summary={
            'updatedAt': status.get('updatedAt') or status.get('lastScan') or radar.get('generatedAt'),
            'heartbeatAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
            'status': status,
            'radar': {
              'totalCandidates': radar.get('summary',{}).get('totalCandidates',0),
              'officialCandidates': radar.get('summary',{}).get('officialCandidates',0),
              'actionableOfficial': radar.get('summary',{}).get('actionableOfficial',0),
              'highPriority': radar.get('summary',{}).get('highPriority',0)
            },
            'ledger': {
              'confirmedIncome': ledger.get('confirmedIncome', ledger.get('totalReceived',0)),
              'status': ledger.get('status','UNCONFIRMED')
            }
          }
          Path('guard-live-summary.json').write_text(json.dumps(summary,separators=(',',':')),encoding='utf-8')
          PY

      - name: Commit fresh Guard state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guard-*.json rewards.json
          if git diff --cached --quiet; then
            echo "No Guard state changes."
            exit 0
          fi
          # Rebase is unsafe here because Guard intentionally regenerates many JSON state files.
          # Reset the working tree to the latest main, keep only freshly generated Guard state,
          # then publish that state as a fast-forward commit.
          git fetch origin main
          git reset --mixed origin/main
          git add guard-*.json rewards.json
          if git diff --cached --quiet; then
            echo "No Guard state changes after sync."
            exit 0
          fi
          git commit -m "chore: refresh immortal guard state [skip render]"
          git push origin HEAD:main

name: ANIL X Production Browser QA

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production contract smoke
        env:
          ANIL_BASE_URL: https://city-of-eternity.onrender.com
        run: node scripts/production-contract-smoke.mjs

      - name: Deep production interaction QA
        env:
          ANIL_BASE_URL: https://city-of-eternity.onrender.com
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | jq -r '.value')
          test -n "$ID_TOKEN" && test "$ID_TOKEN" != "null"
          ANIL_OIDC_TOKEN="$ID_TOKEN" node scripts/production-deep-interaction-qa.mjs

      - name: Full production browser QA
        env:
          ANIL_BASE_URL: https://city-of-eternity.onrender.com
        run: node scripts/production-browser-smoke.mjs

      - name: Upload QA report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anilx-browser-qa-${{ github.run_number }}
          path: artifacts/anil-browser/
          if-no-files-found: warn
          retention-days: 7

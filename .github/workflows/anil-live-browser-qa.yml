name: ANIL X Live Browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Authentication source lint
        run: |
          set -euo pipefail
          ! grep -RInE 'ADMIN_TOKEN|ADMIN_SECRET|anil-x-admin-challenge|id="p2"|const p2' worker.js render-server.mjs functions/api/admin-auth.mjs admin.js admin.html
          ! grep -RInP '(?<!ANIL_)ADMIN_PASSWORD' worker.js render-server.mjs functions/api/admin-auth.mjs admin.js admin.html
          grep -n "ANIL_ADMIN_PASSWORD" functions/api/admin-auth.mjs
          ! grep -n "ANIL_ADMIN_PASSWORD" worker.js render-server.mjs admin.js admin.html
          test "$(grep -RIl "ANIL_ADMIN_PASSWORD" worker.js render-server.mjs functions/api/admin-auth.mjs admin.js admin.html | wc -l)" -eq 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run live site and API smoke
        env:
          BASE_URL: https://anil-x-live.onrender.com
        run: |
          cat > ./anil-live-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL;
          const fail=[];
          const check=(ok,msg)=>{if(!ok){fail.push(msg);console.error('FAIL',msg)}else console.log('PASS',msg)};
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          async function waitForLive(path='/') {
            let last=0;
            for(let i=1;i<=6;i++){
              const r=await page.request.get(base+path);
              last=r.status();
              if(r.ok()) return r;
              await new Promise(x=>setTimeout(x,Math.min(2500*i,10000)));
            }
            throw new Error('Live endpoint did not recover; last HTTP '+last+' '+path);
          }
          try{
            await waitForLive('/');
            const health=await page.request.get(base+'/api/health');
            check(health.ok(),'GET /api/health');
            const hd=await health.json();
            check(hd.ok===true,'health payload ok');
            check(hd.configured?.admin===true,'admin secret configured');
            const readiness=await page.request.get(base+'/api/execution-readiness');
            check(readiness.status()===401,'execution readiness remains owner-gated');
            const gd=await page.request.get(base+'/api/guard/live?t='+Date.now());
            check(gd.status()===401,'Guard remains owner-gated');
            const sd=await page.request.get(base+'/api/anil/super-team');
            check(sd.status()===401,'Super Team remains owner-gated');
            const revenue=await page.request.get(base+'/api/revenue/fleet');
            check(revenue.status()===401,'Revenue Fleet remains owner-gated');
            const bad=await page.request.post(base+'/api/admin/password/login',{data:{password:'__ANIL_QA_INVALID_PASSWORD_2026__'}});
            check(bad.status()===401,'wrong admin password rejected');
            await page.goto(base+'/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            check(await page.title().then(t=>/ANIL X/i.test(t)),'homepage title');
            check(await page.locator('#requestForm').count()===1,'main chat composer exists');
            check(await page.locator('#profileBtn').count()===1,'profile button exists');
            check(await page.locator('#voiceBtn').count()===1,'voice button exists');
            check(await page.locator('#imageInput').count()===1,'file/image input exists');
            if(await page.locator('#profileModal').isVisible()){
              await page.locator('[data-age="adult"]').click();
              await page.locator('[data-goal="business"]').click();
              await page.locator('#saveProfile').click();
              await page.waitForTimeout(250);
            }
            check(await page.locator('#profileModal').isHidden(),'profile onboarding closes');
            const profileTrigger=page.locator('#profileBtn:visible').count();
            if(await profileTrigger){await page.locator('#profileBtn').click()}else{await page.locator('#changeProfile').click()}
            check(await page.locator('#profileModal').isVisible(),'profile controls reopen modal');
            await page.locator('#closeProfile').click();
            check(await page.locator('#profileModal').isHidden(),'profile modal closes');
            const quick=page.locator('[data-request]');
            const quickCount=await quick.count();
            check(quickCount>=4,'quick action buttons discovered');
            for(let i=0;i<quickCount;i++){
              await quick.nth(i).click();
              await page.waitForTimeout(350);
              check(!(await page.locator('#requestInput').inputValue()).includes('<script'),'quick action safe input');
            }
            await page.locator('#requestInput').fill('I need a professional website for my business');
            await page.locator('#requestForm').evaluate(form=>form.requestSubmit());
            await page.waitForTimeout(900);
            check(await page.locator('#chat .msg').count()>=3,'main chat sends and renders a response');
            check(await page.locator('#voiceBtn').isVisible(),'voice control visible');
            check(await page.locator('label[for="imageInput"]').isVisible(),'file/image control visible');
            check(errors.length===0,'no browser page errors during public smoke');
            await page.goto(base+'/admin.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(600);
            check(await page.locator('#password').count()===1,'admin password field exists');
            check(await page.locator('#loginBtn').count()===1,'admin login button exists');
          }finally{
            await browser.close();
          }
          if(fail.length){console.error('SUMMARY',fail);process.exit(1)}
          console.log('ANIL X LIVE QA PASS');
          EOF
          node ./anil-live-qa.mjs
          rm -f ./anil-live-qa.mjs

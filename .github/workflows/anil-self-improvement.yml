name: ANIL X Independent Engine QA
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: anil-independent-engine-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Syntax and independent engine regression
        run: |
          node --check worker.js
          node --check functions/api/anil-engine-chain.mjs
          node --check functions/api/plan.mjs
          node --check functions/api/anil-super-team.mjs
          node scripts/verify-anil-engine-chain.mjs
          python -m py_compile scripts/airdrop_guard.py
      - name: Payment integrity regression
        run: node scripts/verify-payment-integrity.mjs

name: ANIL X Autonomous Revenue Fleet

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: revenue-fleet
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run revenue fleet
        env:
          ANIL_X_REVENUE_URL: https://anil-x-live.onrender.com/api/revenue/fleet/run
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | jq -r '.value')
          test -n "$ID_TOKEN" && test "$ID_TOKEN" != "null"
          curl --fail --silent --show-error --max-time 45             -X POST "$ANIL_X_REVENUE_URL"             -H 'content-type: application/json'             -H "Authorization: Bearer $ID_TOKEN"             -d '{}' > fleet.json
          python - <<'PY'
          import json
          d=json.load(open("fleet.json"))
          assert d.get("ok") is True, d
          print("fleet ok:", len(d.get("engines", [])), "engines")
          print("paid orders:", d.get("accounting", {}).get("paidOrders", 0))
          PY

name: ANIL X — Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate ANIL X site
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -q "ANIL X" index.html
          grep -q "<title>" index.html
          echo "ANIL X production files validated successfully."

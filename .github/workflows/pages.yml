name: ANIL X — Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        run: |
          set -eu
          for f in index.html style.css script.js admin.html admin.css admin.js anil.html payment.html manifest.webmanifest robots.txt sitemap.xml; do test -f "$f"; done
          grep -q "ANIL X" index.html
          grep -q "<title>" index.html
          grep -q "https://saberbadri24-tech.github.io/city-of-eternity/" index.html
          grep -q "https://saberbadri24-tech.github.io/city-of-eternity/sitemap.xml" robots.txt
      - name: Parse every JavaScript file
        run: |
          set -eu
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Check local asset references
        run: |
          set -eu
          for f in index.html admin.html anil.html payment.html; do
            grep -Eo '(href|src)="[^"]+"' "$f" | cut -d'"' -f2 | while read -r ref; do
              case "$ref" in
                http://*|https://*|mailto:*|tel:*|data:*|\#*) continue ;;
              esac
              test -e "${ref#/}" || { echo "Missing local asset: $f -> $ref"; exit 1; }
            done
          done
      - name: Production validation complete
        run: echo "ANIL X production validation passed: files, JavaScript syntax, canonical SEO paths, and local assets."
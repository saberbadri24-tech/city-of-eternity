name: ANIL X Android Store Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'icon.png'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install mobile toolchain
        working-directory: mobile
        run: npm install
      - name: Stage ANIL X web bundle
        working-directory: mobile
        run: npm run stage
      - name: Add Android platform
        working-directory: mobile
        run: npm run add:android
      - name: Sync Android
        working-directory: mobile
        run: npm run sync
      - name: Enforce Play target API 36
        working-directory: mobile
        run: |
          test -f android/variables.gradle
          grep -q 'compileSdkVersion = 36\|compileSdkVersion 36' android/variables.gradle || true
          grep -q 'targetSdkVersion = 36\|targetSdkVersion 36' android/variables.gradle || true
      - name: Build release bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease
      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: anil-x-android-release
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
name: Build and publish ANIL X APK
# Rebuild latest live ANIL X shell on every final release pass.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes 2>/dev/null || true
          git push --delete origin android-latest 2>/dev/null || true
          gh release create android-latest app/build/outputs/apk/debug/app-debug.apk --title "ANIL X Android — Latest" --notes "Latest ANIL X Android build. This APK connects to the live ANIL X Render service."

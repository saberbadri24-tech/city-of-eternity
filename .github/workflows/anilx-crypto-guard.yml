name: ANIL X — Immortal Guard Airdrop+ X

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: immortal-guard
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Global opportunity discovery
        run: python3 scripts/global_opportunity_discovery.py

      - name: Measure source health and discovery coverage
        run: python3 scripts/guard_source_health.py

      - name: Verify discovered opportunities against resolved sources
        run: python3 scripts/verify_global_discovery.py

      - name: Run Airdrop+ scan and advisory queue
        env:
          TZ: UTC
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/airdrop_guard.py

      - name: Run strict free real token hunter
        run: python3 scripts/free_real_token_engine.py

      - name: Verify temporary TON wallet receipts
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: python3 scripts/guard_ton_receipts.py

      - name: Build ranked opportunity intelligence report
        run: python3 scripts/opportunity_intelligence.py

      - name: Run strict token hunter regression tests
        run: python3 -m unittest scripts/test_free_real_token_engine.py -v

      - name: Validate Guard state
        run: |
          python3 -m json.tool guard-discovery.json >/dev/null
          python3 -m py_compile scripts/global_opportunity_discovery.py scripts/guard_source_health.py scripts/verify_global_discovery.py scripts/airdrop_guard.py scripts/free_real_token_engine.py scripts/guard_ton_receipts.py scripts/opportunity_intelligence.py scripts/test_free_real_token_engine.py
          python3 -m json.tool guard-source-health.json >/dev/null
          python3 -m json.tool guard-wallet.json >/dev/null
          python3 -m json.tool guard-status.json >/dev/null
          python3 -m json.tool guard-opportunities.json >/dev/null
          python3 -m json.tool guard-approvals.json >/dev/null
          python3 -m json.tool guard-learning.json >/dev/null
          python3 -m json.tool guard-sources.json >/dev/null
          python3 -m json.tool rewards.json >/dev/null
          python3 -m json.tool guard-opportunity-history.json >/dev/null
          python3 -m json.tool guard-receipts.json >/dev/null
          python3 -m json.tool guard-claim-adapters.json >/dev/null
          python3 -m json.tool guard-free-real-tokens.json >/dev/null
          python3 -m json.tool guard-intelligence.json >/dev/null

      - name: Commit Guard state
        run: |
          git config user.name 'ANIL X Immortal Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.json guard-status.json guard-approvals.json guard-opportunities.json guard-learning.json guard-sources.json guard-wallet.json guard-opportunity-history.json guard-receipts.json guard-discovery.json guard-claim-adapters.json guard-free-real-tokens.json guard-source-health.json guard-intelligence.json
          git diff --cached --quiet || git commit -m 'chore: refresh airdrop guard scan'
          git push

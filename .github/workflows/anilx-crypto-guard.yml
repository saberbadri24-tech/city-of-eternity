name: ANIL X — Immortal Guard Airdrop+ X

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: immortal-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run Airdrop+ claim pipeline
        env:
          TZ: UTC
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, re, hashlib
          from urllib.error import HTTPError, URLError

          REWARDS='rewards.json'
          STATUS='guard-status.json'
          APPROVALS='guard-approvals.json'
          OPS='guard-opportunities.json'
          LEARN='guard-learning.json'
          SOURCES='guard-sources.json'
          WALLET='guard-wallet.json'

          now=datetime.datetime.now(datetime.timezone.utc)
          now_iso=now.isoformat()

          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f: return json.load(f)
              except Exception: return default

          def save(path, value):
              open(path,'w',encoding='utf-8').write(json.dumps(value,ensure_ascii=False,indent=2)+'\n')

          rewards=load(REWARDS, {'guard':'ANIL X Immortal Guard','sources':[]})
          learning=load(LEARN, {'version':'1.0','weights':{'reward':.24,'eligibility':.20,'speed':.14,'cost':.12,'trust':.14,'freshness':.08,'complexity':.08},'outcomes':[],'lastUpdate':None})
          source_registry=load(SOURCES, {'sources':[]})
          wallet=load(WALLET, {'temporaryWalletAddress':'','mainWalletAddress':'','mode':'owner-approval'})

          def fetch(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ANIL-X-Immortal-Guard-AirdropPlus/4.0'})
                  with urllib.request.urlopen(req,timeout=18) as r:
                      return r.status,r.read(300000).decode('utf-8','ignore')[:160000]
              except HTTPError as e: return e.code,''
              except Exception: return None,''

          def norm(s): return re.sub(r'\s+',' ',str(s or '')).strip()
          def digest(s): return hashlib.sha256(norm(s).encode()).hexdigest()[:16]
          def anyof(text, words): return any(w in text for w in words)

          def score_source(s, body):
              t=body.lower(); w=learning.get('weights',{})
              f={
                'reward':1.0 if anyof(t,['reward','airdrop','token','points','quest','campaign']) else .2,
                'eligibility':.55 if anyof(t,['sybil','multiple accounts','disqualified']) else .85,
                'speed':.9 if anyof(t,['ends','deadline','limited','first come','snapshot']) else .55,
                'cost':.45 if anyof(t,['fee','deposit required','minimum deposit']) else .8,
                'trust':.95 if any(x in s.get('url','').lower() for x in ['binance.com','galxe.com','layer3.xyz','zealy.io','questn.com']) else .55,
                'freshness':1.0 if anyof(t,['2026','today','recent','new','launch']) else .5,
                'complexity':.75 if len(body)<60000 else .5
              }
              return round(100*sum(f[k]*w.get(k,0) for k in f),1),f

          existing={s.get('url'):s for s in rewards.get('sources',[]) if s.get('url')}
          for s in source_registry.get('sources',[]):
              if s.get('url'): existing.setdefault(s['url'],s)
          rewards['sources']=list(existing.values())

          blockers=[]
          opportunities=[]
          approvals=[]

          for s in rewards['sources']:
              status,body=fetch(s.get('url',''))
              s.update({'httpStatus':status,'lastScan':now_iso,'guardVersion':'4.0-claim-pipeline','guardMode':'autonomous-monitoring-and-owner-approved-execution'})
              if status is None or not 200 <= status < 300:
                  s.update({'status':'unavailable','actionStage':'SOURCE_BLOCKED','claim':'not-executed'})
                  blockers.append(f"{s.get('name','source')}: source HTTP {status}")
                  continue

              clean=norm(body); low=clean.lower(); score,factors=score_source(s,clean)
              signals=[]
              for n,words in {'airdrop':['airdrop','distribution'],'points':['points','score'],'quest':['quest','mission','task'],'tge':['tge','token generation'],'snapshot':['snapshot'],'deadline':['deadline','ends','limited'],'reward':['reward','rewards'],'claim':['claim','redeem']}.items():
                  if anyof(low,words): signals.append(n)

              requirements=[x for x in ['kyc','register','quiz','connect wallet','signature','captcha','login'] if x in low]
              blocked=any(x in requirements for x in ['kyc','captcha'])
              needs_owner=any(x in requirements for x in ['register','connect wallet','signature','login'])

              if not signals:
                  stage='WATCH'
              elif blocked:
                  stage='WAITING_OWNER'
              elif needs_owner:
                  stage='WAITING_OWNER'
              elif score >= 72 and ('claim' in signals or 'airdrop' in signals or 'reward' in signals):
                  stage='READY_TO_CLAIM'
              else:
                  stage='WATCH'

              op={
                'id':re.sub(r'[^a-z0-9-]+','-',s.get('name','opportunity').lower()).strip('-'),
                'name':s.get('name'),'source':s.get('url'),'type':s.get('type','unknown'),
                'score':score,'signals':signals,'requirements':requirements,
                'status':'HIGH_PRIORITY' if score>=72 else ('WATCH' if score>=55 else 'LOW_PRIORITY'),
                'actionStage':stage,'detectedAt':now_iso,
                'temporaryWalletConfigured':bool(wallet.get('temporaryWalletAddress')),
                'temporaryWalletAddress':wallet.get('temporaryWalletAddress','') if wallet.get('temporaryWalletAddress') else None,
                'claim':'owner-approved-execution-required' if stage=='WAITING_OWNER' else ('claim-ready' if stage=='READY_TO_CLAIM' else 'not-ready'),
                'walletSigning':'never-automatic'
              }
              opportunities.append(op)

              if stage=='WAITING_OWNER':
                  approvals.append({
                    'id':op['id'],'name':op['name'],'source':op['source'],
                    'requiresOwnerApproval':True,'status':'waiting-owner',
                    'action':'complete required login/connection/signature manually, then resume claim',
                    'createdAt':now_iso
                  })
              elif stage=='READY_TO_CLAIM':
                  approvals.append({
                    'id':op['id'],'name':op['name'],'source':op['source'],
                    'requiresOwnerApproval':True,'status':'ready-to-claim',
                    'action':'owner must approve claim transaction before any wallet signature',
                    'createdAt':now_iso
                  })

          report={
            'guard':'ANIL X Immortal Guard','engine':'Airdrop+ X','version':'4.0-claim-pipeline',
            'lastScan':now_iso,'mode':'monitor -> classify -> claim-ready -> owner approval -> temp wallet -> transfer-ready',
            'financialActions':'owner-approved-only','walletPrivateKeys':'never-collected',
            'temporaryWallet': 'configured' if wallet.get('temporaryWalletAddress') else 'not-configured',
            'ownerApprovalRequired':True,'antiSybil':'respected','kycBypass':'disabled','captchaBypass':'disabled',
            'signatureAutomation':'disabled','sourcesScanned':len(rewards['sources']),
            'readyToClaim':sum(1 for x in opportunities if x['actionStage']=='READY_TO_CLAIM'),
            'waitingOwner':sum(1 for x in opportunities if x['actionStage']=='WAITING_OWNER'),
            'blockers':blockers
          }

          rewards['lastScan']=now_iso
          rewards['guardVersion']='4.0-claim-pipeline'
          rewards['policy']='Claim pipeline activated; no seed/private key; no KYC/CAPTCHA bypass; no Sybil abuse; no automatic wallet signature; owner approval required for financial or signing actions.'

          save(REWARDS,rewards); save(STATUS,report); save(APPROVALS,{'guard':'ANIL X Immortal Guard','engine':'Airdrop+ X','updatedAt':now_iso,'approvals':approvals}); save(OPS,{'guard':'ANIL X Immortal Guard','engine':'Airdrop+ X','updatedAt':now_iso,'opportunities':opportunities}); learning['lastUpdate']=now_iso; save(LEARN,learning)
          PY

      - name: Commit Guard state
        run: |
          git config user.name 'ANIL X Immortal Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.json guard-status.json guard-approvals.json guard-opportunities.json guard-learning.json
          git diff --cached --quiet || git commit -m 'feat: activate airdrop claim approval pipeline'
          git push

name: ANIL X — Immortal Guard Airdrop+ X

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: immortal-guard
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Workflow supply-chain security gate
        run: python3 scripts/guard_workflow_security.py

      - name: Final Guard preflight contract
        run: python3 scripts/guard_final_preflight.py

      - name: Immortal Core contracts
        run: |
          python3 scripts/guard_agent_contract.py
          python3 scripts/guard_evidence_ledger.py
          python3 scripts/guard_anomaly_engine.py

      - name: Evolution and 2050 horizon audit
        run: |
          python3 scripts/guard_evolution_engine.py
          python3 scripts/guard_horizon_engine.py
          python3 scripts/future_opportunity_scout.py

      - name: Global opportunity discovery
        run: python3 scripts/global_opportunity_discovery.py

      - name: Measure source health and discovery coverage
        run: python3 scripts/guard_source_health.py

      - name: Verify discovered opportunities against resolved sources
        run: python3 scripts/verify_global_discovery.py

      - name: Run Airdrop+ scan and advisory queue
        env:
          TZ: UTC
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/airdrop_guard.py

      - name: Run strict free real token hunter
        run: python3 scripts/free_real_token_engine.py

      - name: Verify temporary TON wallet receipts
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: python3 scripts/guard_ton_receipts.py

      - name: Build ranked opportunity intelligence report
        run: python3 scripts/opportunity_intelligence.py

      - name: Immortal Core threat gate
        run: python3 scripts/guard_threat_engine.py

      - name: Build high-value multi-brain opportunity report
        run: python3 scripts/high_value_opportunity_engine.py

      - name: Replay and security regression
        run: |
          python3 scripts/guard_replay_engine.py
          python3 -m unittest scripts/test_free_real_token_engine.py -v
          python3 -m unittest scripts/test_opportunity_intelligence.py -v
          python3 -m unittest scripts/test_high_value_opportunity_engine.py -v
          python3 -m unittest scripts/test_guard_evolution.py -v
          python3 -m unittest scripts/test_guard_threat_engine.py -v
          python3 -m unittest scripts/test_guard_workflow_security.py -v
          python3 scripts/guard_resilience_lab.py > guard-resilience-report.json

      - name: Audit modular engine and state health
        run: |
          python3 scripts/guard_module_engine.py
          python3 scripts/guard_modular_core.py
          python3 scripts/guard_evidence_ledger.py
          python3 scripts/guard_anomaly_engine.py
          python3 scripts/guard_replay_engine.py
          python3 scripts/guard_final_preflight.py

      - name: Validate Guard state
        run: |
          for f in guard-discovery.json guard-source-health.json guard-wallet.json guard-status.json guard-opportunities.json guard-approvals.json guard-learning.json guard-sources.json rewards.json guard-opportunity-history.json guard-receipts.json guard-claim-adapters.json guard-free-real-tokens.json guard-intelligence.json guard-high-value.json guard-resilience-report.json guard-module-health.json guard-modular-core.json guard-capabilities.json guard-horizon.json guard-future-signals.json guard-threat-report.json guard-agent-contract.json guard-agent-contract-report.json guard-evidence-ledger.json guard-anomaly-report.json guard-replay-report.json guard-workflow-security.json; do python3 -m json.tool "$f" >/dev/null; done
          python3 -m py_compile scripts/*.py

      - name: Commit Guard state
        run: |
          git config user.name 'ANIL X Immortal Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.json guard-status.json guard-approvals.json guard-opportunities.json guard-learning.json guard-sources.json guard-wallet.json guard-opportunity-history.json guard-receipts.json guard-discovery.json guard-claim-adapters.json guard-free-real-tokens.json guard-source-health.json guard-intelligence.json guard-high-value.json guard-resilience-report.json guard-module-health.json guard-modular-core.json guard-capabilities.json guard-horizon.json guard-future-signals.json guard-threat-report.json guard-agent-contract.json guard-agent-contract-report.json guard-evidence-ledger.json guard-anomaly-report.json guard-replay-report.json guard-workflow-security.json
          git diff --cached --quiet || git commit -m 'chore: refresh immortal guard state'
          git push

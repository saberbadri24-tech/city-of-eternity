name: ANIL X — Immortal Guard Airdrop+ X

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: immortal-guard
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run Airdrop+ self-learning engine
        env:
          TZ: UTC
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, re, hashlib, math
          from urllib.error import HTTPError, URLError

          REWARDS='rewards.json'
          STATUS='guard-status.json'
          APPROVALS='guard-approvals.json'
          OPS='guard-opportunities.json'
          LEARN='guard-learning.json'
          SOURCES='guard-sources.json'

          now=datetime.datetime.now(datetime.timezone.utc)
          now_iso=now.isoformat()

          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return default

          rewards=load(REWARDS, {'guard':'ANIL X Immortal Guard','sources':[]})
          learning=load(LEARN, {
              'version':'1.0',
              'weights':{
                  'reward':0.24,'eligibility':0.20,'speed':0.14,
                  'cost':0.12,'trust':0.14,'freshness':0.08,'complexity':0.08
              },
              'outcomes':[],
              'lastUpdate':None
          })
          source_registry=load(SOURCES, {'sources':[]})

          def fetch(url):
              try:
                  req=urllib.request.Request(url, headers={
                      'User-Agent':'ANIL-X-Immortal-Guard-AirdropPlus/3.0'
                  })
                  with urllib.request.urlopen(req, timeout=18) as r:
                      body=r.read(300000).decode('utf-8','ignore')
                      return r.status, body[:160000]
              except HTTPError as e:
                  return e.code, ''
              except (URLError, TimeoutError, Exception):
                  return None, ''

          def norm(s):
              return re.sub(r'\\s+', ' ', str(s or '')).strip()

          def digest(text):
              return hashlib.sha256(norm(text).encode()).hexdigest()[:16]

          def contains_any(text, words):
              return any(w in text for w in words)

          def score_source(s, body):
              t=body.lower()
              reward_signal=1.0 if contains_any(t, [
                  'reward','airdrop','token','points','quest','campaign'
              ]) else 0.2
              eligibility_signal=0.85 if not contains_any(t, [
                  'sybil','multiple accounts','disqualified'
              ]) else 0.55
              speed_signal=0.9 if contains_any(t, [
                  'ends','deadline','limited','first come','snapshot'
              ]) else 0.55
              cost_signal=0.8 if not contains_any(t, [
                  'fee','deposit required','minimum deposit'
              ]) else 0.45
              trust_signal=0.95 if any(x in s.get('url','').lower() for x in [
                  'binance.com','galxe.com','layer3.xyz','zealy.io',
                  'questn.com','official'
              ]) else 0.55
              freshness_signal=1.0 if contains_any(t, [
                  '2026','today','recent','new','launch'
              ]) else 0.5
              complexity_signal=0.75 if len(body) < 60000 else 0.5

              w=learning.get('weights',{})
              raw=(
                  reward_signal*w.get('reward',.24)+
                  eligibility_signal*w.get('eligibility',.20)+
                  speed_signal*w.get('speed',.14)+
                  cost_signal*w.get('cost',.12)+
                  trust_signal*w.get('trust',.14)+
                  freshness_signal*w.get('freshness',.08)+
                  complexity_signal*w.get('complexity',.08)
              )
              return round(raw*100,1), {
                  'reward':reward_signal,
                  'eligibility':eligibility_signal,
                  'speed':speed_signal,
                  'cost':cost_signal,
                  'trust':trust_signal,
                  'freshness':freshness_signal,
                  'complexity':complexity_signal
              }

          # Merge the durable registry with existing known sources.
          existing={s.get('url'):s for s in rewards.get('sources',[]) if s.get('url')}
          for s in source_registry.get('sources',[]):
              if s.get('url') and s['url'] not in existing:
                  existing[s['url']]=s
          rewards['sources']=list(existing.values())

          blockers=[]
          opportunities=[]
          approvals=[]

          for s in rewards.get('sources',[]):
              status, body=fetch(s.get('url',''))
              s['httpStatus']=status
              s['lastScan']=now_iso
              s['guardVersion']='3.0-airdrop-plus'
              s['guardMode']='adaptive-monitor'
              s['claim']='not-automated'
              if status is None or not (200 <= status < 300):
                  s['status']='unavailable'
                  blockers.append(f"{s.get('name','source')}: source HTTP {status}")
                  continue

              clean=norm(body)
              low=clean.lower()
              score, factors=score_source(s, clean)
              fp=digest(clean)

              s['status']='official-source-live'
              s['contentFingerprint']=fp
              s['opportunityScore']=score
              s['scoreFactors']=factors
              s['signals']=[]
              signal_words={
                  'airdrop':['airdrop','distribution'],
                  'points':['points','score'],
                  'quest':['quest','mission','task'],
                  'tge':['tge','token generation'],
                  'snapshot':['snapshot'],
                  'deadline':['deadline','ends','limited'],
                  'reward':['reward','rewards'],
                  'testnet':['testnet','devnet'],
                  'referral':['referral','invite'],
                  'claim':['claim','redeem']
              }
              for name, words in signal_words.items():
                  if contains_any(low, words):
                      s['signals'].append(name)

              needs=[]
              for word in ('kyc','register','quiz','connect wallet','signature'):
                  if word in low:
                      needs.append(word)
              s['requirementsObserved']=needs

              opportunity={
                  'id':re.sub(r'[^a-z0-9-]+','-',s.get('name','opportunity').lower()).strip('-'),
                  'name':s.get('name'),
                  'source':s.get('url'),
                  'type':s.get('type','unknown'),
                  'score':score,
                  'signals':s['signals'],
                  'requirements':needs,
                  'status':'candidate',
                  'detectedAt':now_iso,
                  'actionMode':'owner-approval-when-required',
                  'walletSigning':'never-automatic'
              }

              # Fast lane: only high-signal, high-score official sources.
              if score >= 72 and ('airdrop' in s['signals'] or 'reward' in s['signals'] or 'claim' in s['signals']):
                  opportunity['status']='HIGH_PRIORITY'
                  approvals.append({
                      'id':opportunity['id'],
                      'name':s.get('name'),
                      'requiresOwnerApproval':True,
                      'reason':'High-value official opportunity detected; owner must approve any login/KYC/signature/payment/claim step.',
                      'source':s.get('url'),
                      'createdAt':now_iso,
                      'status':'waiting-owner'
                  })
              elif score >= 55:
                  opportunity['status']='WATCH'
              else:
                  opportunity['status']='LOW_PRIORITY'

              opportunities.append(opportunity)

          # Self-learning: update weights from outcomes without changing executable code.
          outcomes=learning.get('outcomes',[])
          for o in outcomes[-100:]:
              try:
                  success=float(o.get('netValue',0)) > 0
                  typ=o.get('type')
                  if success and typ in learning['weights']:
                      learning['weights'][typ]=min(0.40, learning['weights'][typ]+0.005)
              except Exception:
                  pass

          total=sum(learning['weights'].values()) or 1
          for k in list(learning['weights']):
              learning['weights'][k]=round(learning['weights'][k]/total,4)

          learning['lastUpdate']=now_iso
          learning['policy']='Learns from observed outcomes and source signals; never self-edits executable code, secrets, wallet keys, or security policy.'

          # De-duplicate approvals and opportunities.
          approvals={a['id']:a for a in approvals}
          opportunities={o['id']:o for o in opportunities}

          report={
              'guard':'ANIL X Immortal Guard',
              'engine':'Airdrop+ X',
              'version':'3.0-self-learning-opportunity-engine',
              'lastScan':now_iso,
              'mode':'autonomous-monitoring-and-learning',
              'selfUpdate':'adaptive-data-and-rules-only',
              'financialActions':'disabled',
              'walletPrivateKeys':'never-collected',
              'ownerApprovalRequired':True,
              'antiSybil':'respected',
              'kycBypass':'disabled',
              'captchaBypass':'disabled',
              'signatureAutomation':'disabled',
              'sourcesScanned':len(rewards.get('sources',[])),
              'highPriority':sum(1 for x in opportunities.values() if x['status']=='HIGH_PRIORITY'),
              'watch':sum(1 for x in opportunities.values() if x['status']=='WATCH'),
              'blockers':blockers
          }

          rewards['lastScan']=now_iso
          rewards['guardVersion']='3.0-self-learning-opportunity-engine'
          rewards['policy']='No seed/private key; no KYC/CAPTCHA bypass; no Sybil/multi-account abuse; no wallet signature or approval without owner action; no fabricated claims. Guard may learn scores, source freshness and prioritization from observed results.'

          open(REWARDS,'w',encoding='utf-8').write(json.dumps(rewards,ensure_ascii=False,indent=2)+'\\n')
          open(STATUS,'w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\\n')
          open(APPROVALS,'w',encoding='utf-8').write(json.dumps({
              'guard':'ANIL X Immortal Guard',
              'engine':'Airdrop+ X',
              'updatedAt':now_iso,
              'approvals':list(approvals.values())
          },ensure_ascii=False,indent=2)+'\\n')
          open(OPS,'w',encoding='utf-8').write(json.dumps({
              'guard':'ANIL X Immortal Guard',
              'engine':'Airdrop+ X',
              'updatedAt':now_iso,
              'opportunities':list(opportunities.values())
          },ensure_ascii=False,indent=2)+'\\n')
          open(LEARN,'w',encoding='utf-8').write(json.dumps(learning,ensure_ascii=False,indent=2)+'\\n')
          PY

      - name: Commit Guard learning state
        run: |
          git config user.name 'ANIL X Immortal Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.json guard-status.json guard-approvals.json guard-opportunities.json guard-learning.json
          git diff --cached --quiet || git commit -m 'chore: airdrop-plus autonomous learning cycle'
          git push

name: ANIL X — Immortal Guard Airdrop+ X

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: immortal-guard
  cancel-in-progress: true

jobs:
  guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Global opportunity discovery
        run: python3 scripts/global_opportunity_discovery.py

      - name: Run Airdrop+ scan and advisory queue
        env:
          TZ: UTC
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/airdrop_guard.py

      - name: Verify temporary TON wallet receipts
        env:
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: python3 scripts/guard_ton_receipts.py

      - name: Validate Guard state
        run: |
          python3 -m json.tool guard-discovery.json >/dev/null
          python3 -m json.tool guard-wallet.json >/dev/null
          python3 -m json.tool guard-status.json >/dev/null
          python3 -m json.tool guard-opportunities.json >/dev/null
          python3 -m json.tool guard-approvals.json >/dev/null
          python3 -m json.tool guard-learning.json >/dev/null
          python3 -m json.tool guard-sources.json >/dev/null
          python3 -m json.tool rewards.json >/dev/null
          python3 -m json.tool guard-opportunity-history.json >/dev/null
          python3 -m json.tool guard-receipts.json >/dev/null

      - name: Commit Guard state
        run: |
          git config user.name 'ANIL X Immortal Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.json guard-status.json guard-approvals.json guard-opportunities.json guard-learning.json guard-sources.json guard-wallet.json guard-opportunity-history.json guard-receipts.json guard-discovery.json
          git diff --cached --quiet || git commit -m 'chore: refresh airdrop guard scan'
          git push

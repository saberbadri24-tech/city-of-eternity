name: ANIL X Predeploy CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Validate package
        run: node -e "JSON.parse(require('fs').readFileSync('package.json')); console.log('package ok')"
      - name: Validate autonomy
        run: node -e "const p=require('./ANIL-X-AUTONOMY-POLICY.json'); const a=p.autonomy||{}; if(a.production_code_mutation||a.payment_execution||a.secret_rotation||a.dns_changes) throw new Error('unsafe autonomy policy'); console.log('policy ok')"
      - name: Validate functions recursively
        run: |
          find functions -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
          find functions -type f -name '*.mts' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "/tmp/$(basename "$f" .mts).mjs"
            node --check "/tmp/$(basename "$f" .mts).mjs"
          done
      - name: Run Javidan deterministic self-test
        run: node scripts/javidan-node-selftest.mjs
      - name: Run static link and legacy-reference audit
        run: node scripts/predeploy-static-check.mjs

  live-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Run live Render QA
        env:
          ANILX_LIVE_URL: https://city-of-eternity.onrender.com
        run: node scripts/live-qa.mjs

name: Immortal Guard — Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: immortal-guard-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Guard heartbeat and recover stale cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANIL_X_RENDER_URL: https://anil-x-live.onrender.com
        run: |
          set -euo pipefail
          TOKEN="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | python -c "import sys,json; print(json.load(sys.stdin)['value'])")"
          curl -sSf --max-time 20             -H "Authorization: Bearer $TOKEN"             "$ANIL_X_RENDER_URL/api/guard/watchdog" >/tmp/guard-watchdog.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/guard-watchdog.json'))
          if not d.get("ok"): raise SystemExit("Guard watchdog endpoint returned not-ok")
          age=d.get("freshness",{}).get("minutesSinceUpdate")
          stale=d.get("freshness",{}).get("stale")
          print("Guard heartbeat age:", age, "minutes; stale:", stale)
          if age is not None and not stale:
              print("WATCHDOG=PASS")
              raise SystemExit(0)
          print("WATCHDOG=RECOVERY_REQUEST")
          PY
          gh workflow run "immortal-guard.yml" --repo "$GITHUB_REPOSITORY" --ref main
          echo "Recovery dispatch submitted."
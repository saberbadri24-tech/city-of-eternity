name: Immortal Guard — Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: immortal-guard-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Guard heartbeat and recover stale cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, datetime, os
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://raw.githubusercontent.com/{repo}/main/guard-status.json?ts={int(datetime.datetime.now().timestamp())}"
          try:
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=10) as r: data=json.load(r)
              ts=data.get("lastScan") or data.get("updatedAt") or data.get("heartbeatAt")
              if not ts: raise RuntimeError("missing_guard_timestamp")
              t=datetime.datetime.fromisoformat(ts.replace("Z","+00:00"))
              age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/60
              print(f"Guard heartbeat age: {age:.1f} minutes")
              if age <= 8:
                  print("WATCHDOG=PASS")
                  raise SystemExit(0)
          except Exception as e:
              print("Guard heartbeat unavailable/stale:",e)
          print("WATCHDOG=RECOVERY_REQUEST")
          PY
          gh workflow run "immortal-guard.yml" --repo "$GITHUB_REPOSITORY" --ref main
          echo "Recovery dispatch submitted."
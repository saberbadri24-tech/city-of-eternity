name: ANIL X Controlled Change

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch one owner-approved change request
        id: request
        env:
          ANIL_API_URL: https://city-of-eternity.onrender.com
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             "$ANIL_API_URL/api/anil/automation/queue" > /tmp/request.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/request.json'))
          r=d.get('request')
          if not r:
              open('/tmp/no-request','w').write('1')
              print('No queued change request.')
          else:
              open('/tmp/request-env','w').write(
                  f"ANIL_REQUEST_ID={r['id']}\nANIL_REQUEST_PATH={r['path']}\n"
                  f"ANIL_REQUEST_MESSAGE={r['message']}\n"
              )
              open('/tmp/change-content','w').write(r['content'])
          PY
          if test -f /tmp/request-env; then cat /tmp/request-env >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.ANIL_REQUEST_ID != ''

      - name: Create controlled branch and PR
        if: env.ANIL_REQUEST_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="anil/$ANIL_REQUEST_ID"
          git fetch origin main
          git checkout -b "$branch" origin/main
          mkdir -p "$(dirname "$ANIL_REQUEST_PATH")"
          cp /tmp/change-content "$ANIL_REQUEST_PATH"
          git config user.name "ANIL X Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ANIL_REQUEST_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "$ANIL_REQUEST_MESSAGE"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch"             --title "ANIL X: $ANIL_REQUEST_MESSAGE"             --body "Owner-approved ANIL X change request $ANIL_REQUEST_ID. Automated checks are required before merge."

      - name: Install and test
        if: env.ANIL_REQUEST_ID != ''
        run: |
          npm install
          npm test --if-present

      - name: Production browser smoke
        if: env.ANIL_REQUEST_ID != ''
        env:
          ANIL_BASE_URL: https://city-of-eternity.onrender.com
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/production-browser-smoke.mjs

      - name: Security and dependency gate
        if: env.ANIL_REQUEST_ID != ''
        run: |
          npm audit --omit=dev --audit-level=high
          node --check worker.js
          node --check functions/api/plan.mjs
          node --check functions/api/anil-tools.mjs

      - name: Merge verified owner-approved change
        if: env.ANIL_REQUEST_ID != ''
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh pr merge "anil/$ANIL_REQUEST_ID" --squash --delete-branch --repo "$GITHUB_REPOSITORY"

      - name: Mark controlled request processed
        if: env.ANIL_REQUEST_ID != ''
        env:
          ANIL_API_URL: https://city-of-eternity.onrender.com
        run: |
          TOKEN="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=anil-x" | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "$ANIL_API_URL/api/anil/automation/queue?id=$ANIL_REQUEST_ID"

name: ANIL X Control Plane — regression stop and operational gate
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: anil-control-plane-gate
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Dependency audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax gate
        run: node scripts/verify-syntax.mjs
      - name: Final contract smoke gate
        run: node scripts/anil-final-contract-smoke.mjs
      - name: Production browser QA
        env:
          ANIL_BASE_URL: https://anil-x-live.onrender.com
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/production-browser-smoke.mjs
      - name: Live control-plane gate
        env:
          BASE_URL: https://anil-x-live.onrender.com
        run: |
          set -euo pipefail
          curl -sS --max-time 30 "$BASE_URL/api/health" -o /tmp/health.json || true
          curl -sS --max-time 30 "$BASE_URL/api/guard/live?t=$(date +%s)" -o /tmp/guard.json || true
          curl -sS --max-time 30 "$BASE_URL/api/anil/super-team" -o /tmp/team.json || true
          echo '--- CONTROL PLANE HEALTH ---'; cat /tmp/health.json || true
          echo '--- CONTROL PLANE GUARD ---'; cat /tmp/guard.json || true
          echo '--- CONTROL PLANE SUPER TEAM ---'; cat /tmp/team.json || true
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); g=json.load(open('/tmp/guard.json')); t=json.load(open('/tmp/team.json'))
          assert h.get('ok') is True
          assert g.get('ok') is True
          assert t.get('ok') is True and t.get('safety',{}).get('finalCommand')=='ANIL'
          assert t.get('safety',{}).get('autoSigning') is False
          # Guard freshness is enforced by the dedicated Guard workflow; the ANIL control gate only requires a valid Guard snapshot.
          print('Guard freshness:', g.get('freshness',{}))
          print('ANIL CONTROL PLANE GATE PASS')
          PY

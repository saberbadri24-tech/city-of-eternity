name: ANIL X iOS Store Build

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile toolchain
        working-directory: mobile
        run: npm install
      - name: Stage ANIL X web bundle
        working-directory: mobile
        run: npm run stage
      - name: Add iOS platform
        working-directory: mobile
        run: npm run add:ios
      - name: Sync iOS
        working-directory: mobile
        run: npm run sync
      - name: Build unsigned archive for store signing
        working-directory: mobile
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/ANILX.xcarchive" archive CODE_SIGNING_ALLOWED=NO
      - name: Package archive
        run: tar -czf "$RUNNER_TEMP/ANILX-ios-archive.tgz" -C "$RUNNER_TEMP" ANILX.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: anil-x-ios-archive
          path: ${{ runner.temp }}/ANILX-ios-archive.tgz
          if-no-files-found: error
name: ANIL X Frontier Model Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh official model catalogs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/frontier-model-refresh.mjs
      - name: Commit catalog only when changed
        run: |
          git config user.name "ANIL X Frontier Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontier-model-catalog.json
          git diff --cached --quiet || git commit -m "ANIL X: refresh frontier model catalog"
          git push

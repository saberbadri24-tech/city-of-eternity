name: ANIL X — Experience Polish
on:
  push:
    branches: [main]
    paths:
      - 'script.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: !contains(github.event.head_commit.message, 'ANIL X: experience polish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply experience layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text()
          marker='/* ANIL_X_EXPERIENCE_POLISH_V1 */'
          if marker in s:
              raise SystemExit(0)
          code=r'''
          /* ANIL_X_EXPERIENCE_POLISH_V1 */
          (()=>{
            const d=document,b=d.body;
            const style=d.createElement('style');
            style.textContent=`.ax-silent{display:inline-flex;align-items:center;gap:8px;color:#bda878;font-size:10px}.ax-silent i{width:6px;height:6px;border-radius:50%;background:#d8ad4f;box-shadow:0 0 14px #d8ad4f;animation:axpulse 1.4s ease-in-out infinite}.ax-silent.done i{background:#9dcc8f;box-shadow:0 0 12px #9dcc8f;animation:none}@keyframes axpulse{50%{opacity:.25;transform:scale(.65)}}.ax-ambient{position:fixed;inset:0;pointer-events:none;z-index:18;overflow:hidden}.ax-ambient:before{content:"";position:absolute;width:42vw;height:42vw;min-width:280px;min-height:280px;left:50%;top:23%;transform:translate(-50%,-50%);border:1px solid rgba(216,173,79,.055);border-radius:50%;box-shadow:0 0 0 38px rgba(216,173,79,.018),0 0 0 76px rgba(216,173,79,.012)}.ax-orb{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe0a0;box-shadow:0 0 14px #d8ad4f;opacity:.45;animation:axdrift linear infinite}.ax-orb:nth-child(1){left:12%;top:36%;animation-duration:19s}.ax-orb:nth-child(2){left:83%;top:31%;animation-duration:23s}.ax-orb:nth-child(3){left:72%;top:70%;animation-duration:27s}.ax-orb:nth-child(4){left:26%;top:76%;animation-duration:31s}@keyframes axdrift{50%{transform:translate(18px,-26px);opacity:.12}100%{transform:translate(-9px,18px);opacity:.45}}.ax-focus{box-shadow:0 0 0 1px rgba(255,224,160,.24),0 22px 80px rgba(216,173,79,.12),inset 0 1px 0 rgba(255,255,255,.06)!important;transform:translateY(-2px)}.ax-result-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}.ax-result-head .sig{width:9px;height:9px;border-radius:50%;background:#9dcc8f;box-shadow:0 0 13px #9dcc8f}.ax-result-head small{margin-inline-start:auto;color:#756b5b;font-size:9px}.ax-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.ax-quick button{border:1px solid rgba(216,173,79,.18);background:rgba(216,173,79,.045);color:#d8c6a4;border-radius:999px;padding:7px 10px;font-size:10px}.ax-quick button:hover{border-color:rgba(255,224,160,.5);color:#ffe0a0;transform:translateY(-1px)}@media (max-width:700px){.ax-ambient:before{width:78vw;height:78vw}.ax-quick button{padding:8px 9px}}`;
            d.head.appendChild(style);
            const ambient=d.createElement('div');ambient.className='ax-ambient';for(let i=0;i<4;i++){const o=d.createElement('span');o.className='ax-orb';ambient.appendChild(o)}b.appendChild(ambient);
            const assistant=d.querySelector('.assistant'),composerTop=d.querySelector('.composer-top');
            if(composerTop){const em=composerTop.querySelector('em');if(em)em.textContent='بی‌صدا در پس‌زمینه؛ نتیجه مهم است'}
            const setSilent=on=>{let el=d.querySelector('#axSilent');if(!el&&composerTop){el=d.createElement('span');el.id='axSilent';el.className='ax-silent';el.innerHTML='<i></i><span>موتور آماده</span>';composerTop.appendChild(el)}if(el){el.classList.toggle('done',!on);el.querySelector('span').textContent=on?'در حال ساخت مسیر':'موتور آماده'}};
            const input=d.querySelector('#requestInput'),form=d.querySelector('#requestForm'),chat=d.querySelector('#chat');
            const routeWords=[['fix',['خطا','ارور','خراب','مشکل'],'diagnostic'],['growth',['رشد','مشتری','فروش','درآمد'],'growth'],['website',['سایت','فروشگاه','لندینگ'],'build'],['video',['تیزر','ویدیو','کلیپ'],'create']];
            const classify=t=>{const x=String(t||'').toLowerCase();for(const [id,keys,mode] of routeWords)if(keys.some(k=>x.includes(k)))return [id,mode];return ['custom','adaptive']};
            const glow=mode=>{b.dataset.axMode=mode;if(assistant){assistant.classList.add('ax-focus');setTimeout(()=>assistant.classList.remove('ax-focus'),650)}};
            if(form&&input)form.addEventListener('submit',()=>{const [,mode]=classify(input.value);glow(mode);setSilent(true);setTimeout(()=>setSilent(false),7000)},{capture:true});
            if(chat){const mo=new MutationObserver(()=>{const msgs=[...chat.querySelectorAll('.msg')],last=msgs[msgs.length-1];if(last&&last.classList.contains('bot')){last.classList.add('ax-focus');const p=last.querySelector('p');if(p&&!last.querySelector('.ax-result-head')){const head=d.createElement('div');head.className='ax-result-head';head.innerHTML='<span class="sig"></span><b>مسیر آماده است</b><small>ANIL X</small>';last.insertBefore(head,p);const q=d.createElement('div');q.className='ax-quick';q.innerHTML='<button data-q="پیش‌نمایش بساز">پیش‌نمایش</button><button data-q="جزئیات مسیر را باز کن">جزئیات مسیر</button><button data-q="از همین‌جا شروع کن">شروع اجرا</button>';q.addEventListener('click',e=>{const btn=e.target.closest('[data-q]');if(btn&&input){input.value=btn.dataset.q;input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()}});last.appendChild(q)}}});mo.observe(chat,{childList:true})}
            const pointer=e=>{if(matchMedia('(pointer:fine)').matches){const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;b.style.setProperty('--ax-x',x.toFixed(3));b.style.setProperty('--ax-y',y.toFixed(3))}};d.addEventListener('pointermove',pointer,{passive:true});
            const mark=d.querySelector('.hero-orbit');if(mark){mark.style.transform='translate(calc(var(--ax-x,0) * 12px),calc(var(--ax-y,0) * 12px))';mark.style.transition='transform .25s ease-out'}
          })();
          '''
          p.write_text(s+code)
          PY
      - name: Commit polished experience
        run: |
          git config user.name 'ANIL X Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'ANIL X: experience polish'
          git push

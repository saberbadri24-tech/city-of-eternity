name: ANIL X — Experience Polish
on:
  push:
    branches: [main]
    paths:
      - 'experience-layer.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach experience layer
        run: |
          grep -q 'ANIL_X_EXPERIENCE_POLISH_V2' script.js || cat experience-layer.js >> script.js
      - name: Commit polished experience
        run: |
          git config user.name 'ANIL X Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'ANIL X: experience polish'
          git push

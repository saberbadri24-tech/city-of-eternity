<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>ANIL X | صندوق انتقادات و پیشنهادات</title><style>
:root{--bg:#020814;--panel:#07182b;--line:#17466e;--gold:#e9bd4e;--green:#18e6a0;--muted:#91a9c3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#15466f,#020814 62%);color:#f5f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(820px,92%);margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.top a{color:#fff;text-decoration:none}.card{margin-top:35px;background:linear-gradient(145deg,#081d35,#040d19);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 15px 55px #0008}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.grid button,textarea,input,.send{font:inherit}.grid button{border:1px solid #285273;background:#061426;color:#cfe2f5;border-radius:12px;padding:11px;cursor:pointer}.grid button.active{border-color:var(--gold);color:#fff;background:#3c2d0e}textarea,input{width:100%;border:1px solid #285273;background:#020b16;color:#fff;border-radius:12px;padding:12px;outline:none;margin:7px 0}textarea{min-height:170px;resize:vertical}.send{width:100%;border:1px solid #0e9b71;background:linear-gradient(90deg,#087c60,#13c890);color:#fff;border-radius:13px;padding:13px;font-weight:900;cursor:pointer}.status{min-height:24px;text-align:center;color:var(--green);margin-top:12px}.note{color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style></head><body data-project-state="ANILX-ADVANCED-AUDIT-V1"><div class="wrap"><header class="top"><a href="fa.html">𐎠 ANIL X</a><nav><a href="fun.html">🎮 پازل و صندوق</a> · <a href="prizes.html">🎁 پاداش</a> · <a href="admin.html">👑 مدیر</a></nav></header><main class="card"><span class="eyebrow">ANIL X · FEEDBACK VAULT</span><h1>📬 صندوق انتقادات و پیشنهادات</h1><p class="note">اینجا هر ایراد، پیشنهاد، ایده یا گزارش خطا مستقیم به هسته ANIL X می‌رسد. اطلاعات اضافی لازم نیست.</p><div class="grid"><button data-kind="suggestion" class="active">پیشنهاد</button><button data-kind="criticism">انتقاد</button><button data-kind="idea">ایده</button><button data-kind="bug">گزارش خطا</button></div><textarea id="message" maxlength="4000" placeholder="چی را بهتر کنیم؟"></textarea><input id="email" type="email" maxlength="160" placeholder="ایمیل اختیاری برای پاسخ"><button id="send" class="send">ارسال به صندوق ANIL X</button><div id="status" class="status"></div><p class="note">این صندوق درآمد یا جایزه نقدی را تضمین نمی‌کند؛ فقط بازخورد ثبت‌شده را وارد مسیر بهبود می‌کند.</p></main></div><script>
let kind='suggestion';const kindLabels={suggestion:'پیشنهاد',criticism:'انتقاد',idea:'ایده',bug:'گزارش خطا'};const statusEl=document.querySelector('#status');document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#message').placeholder=kind==='bug'?'شرح دقیق خطا و مسیر رخداد را بنویس.':'چی را بهتر کنیم؟';statusEl.textContent='دسته انتخاب شد: '+(kindLabels[kind]||kind);});
document.querySelector('#send').onclick=async()=>{const message=document.querySelector('#message').value.trim(),email=document.querySelector('#email').value.trim(),s=document.querySelector('#status');if(!message){s.textContent='متن پیشنهاد یا انتقاد را بنویس.';return}const btn=document.querySelector('#send');btn.disabled=true;btn.textContent='در حال ثبت…';try{const r=await fetch('/api/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kind,message,email,page:location.pathname})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'ثبت نشد');s.textContent='✓ ثبت شد؛ ممنون. ANIL X آن را وارد مسیر بررسی می‌کند.';document.querySelector('#message').value='';}catch(e){s.textContent='اتصال صندوق فعلاً در دسترس نیست؛ متن را کپی و دوباره تلاش کن.'}finally{btn.disabled=false;btn.textContent='ارسال به صندوق ANIL X'}};
</script></body></html>

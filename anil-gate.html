<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>آنیل — دروازه ابدیت</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7vh;pointer-events:none;z-index:10}
#title{font-size:clamp(1rem,5vw,2.4rem);font-weight:900;letter-spacing:.15em;text-align:center;padding:0 20px;background:linear-gradient(180deg,#fff8d0 0%,#f0b830 40%,#a06010 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 15px #e09020);animation:flt 4s ease-in-out infinite;margin-bottom:.3em;font-family:Georgia,serif}
#sub{font-size:clamp(.55rem,2vw,.85rem);color:#c8922a;letter-spacing:.4em;opacity:.8;text-align:center;animation:flt 4s ease-in-out infinite .7s;margin-bottom:4vh;font-family:Georgia,serif}
#btn{pointer-events:all;cursor:pointer;background:transparent;border:1.5px solid rgba(220,150,30,.6);color:#f0d070;font-size:clamp(.7rem,2vw,.9rem);letter-spacing:.3em;padding:14px 48px;font-family:Georgia,serif;transition:all .3s;text-shadow:0 0 10px #d09020;-webkit-tap-highlight-color:transparent}
#btn:active{border-color:#f0c040;color:#fff;box-shadow:0 0 30px rgba(220,150,20,.5)}
#flash{position:fixed;inset:0;background:#fffbe0;opacity:0;pointer-events:none;z-index:99;transition:opacity .2s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="ui">
  <div id="title">CITY OF ETERNITY</div>
  <div id="sub">آنیل · دروازه ابدیت</div>
  <button id="btn">ورود به شهر</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,t0=null;
const ST=[];
for(let i=0;i<300;i++)ST.push({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.2,sp:Math.random()*.0003+.00005,op:Math.random()*.9+.1,tw:Math.random()*6.28,r:Math.floor(Math.random()*3)});
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();window.addEventListener('resize',resize);
function sky(t){
  const g=ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H));
  g.addColorStop(0,'hsl(32,45%,6%)');g.addColorStop(.4,'hsl(25,38%,3%)');g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    const ng=ctx.createRadialGradient(W*(.2+i*.3)+Math.sin(t*.03+i)*50,H*(.2+i*.08),0,W*(.2+i*.3),H*(.2+i*.08),Math.min(W,H)*(.2+i*.07));
    ng.addColorStop(0,`rgba(${[160,100,200][i]},${[80,60,100][i]},${[20,20,60][i]},.05)`);ng.addColorStop(1,'transparent');
    ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);ctx.restore();
  }
}
function drawStars(t){
  ST.forEach(p=>{
    p.tw+=p.sp*20;
    const px=((p.x*W+Math.sin(t*p.sp*300+p.tw)*12)%W+W)%W;
    const py=((p.y*H+t*p.sp*H*.06)%H+H)%H;
    const a=p.op*(.3+Math.sin(p.tw)*.7);
    const cols=['#fff8d0','#f0c060','#ffffff'];
    ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=6;ctx.shadowColor=cols[p.r];ctx.fillStyle=cols[p.r];ctx.beginPath();ctx.arc(px,py,p.s,0,6.28);ctx.fill();ctx.restore();
  });
}
function archPath(cx,cy,gw,gh){
  const l=cx-gw/2,r=cx+gw/2,tp=cy-gh/2,bt=cy+gh/2,ah=gh*.38;
  ctx.beginPath();ctx.moveTo(l,bt);ctx.lineTo(l,tp+ah);
  ctx.bezierCurveTo(l,tp+ah*.1,cx-gw*.04,tp-gh*.04,cx,tp-gh*.05);
  ctx.bezierCurveTo(cx+gw*.04,tp-gh*.04,r,tp+ah*.1,r,tp+ah);
  ctx.lineTo(r,bt);ctx.closePath();
}
function drawGate(t){
  const cx=W/2,cy=H*.45;
  const GW=Math.min(W*.62,440),GH=Math.min(H*.75,560);
  // rays
  for(let i=0;i<14;i++){
    const a=(i/14)*6.28+t*.035,len=Math.min(W,H)*.7,al=.008+Math.sin(t*.55+i)*.004;
    const rg=ctx.createLinearGradient(cx,cy*.88,cx+Math.cos(a)*len,cy*.88+Math.sin(a)*len);
    rg.addColorStop(0,`rgba(230,150,20,${al*5})`);rg.addColorStop(1,'transparent');
    ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle=rg;ctx.lineWidth=22+Math.sin(t+i)*6;ctx.globalAlpha=al*4;ctx.beginPath();ctx.moveTo(cx,cy*.88);ctx.lineTo(cx+Math.cos(a)*len,cy*.88+Math.sin(a)*len);ctx.stroke();ctx.restore();
  }
  // halos
  for(let i=7;i>0;i--){
    const ex=i*20+Math.sin(t*.5)*5;
    ctx.save();ctx.globalAlpha=.022*i;ctx.strokeStyle=`hsl(${35+i*2},88%,${50+i*4}%)`;ctx.lineWidth=1;archPath(cx,cy,GW+ex,GH+ex*.35);ctx.stroke();ctx.restore();
  }
  // interior
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,GW*.55);
  ig.addColorStop(0,`rgba(255,220,100,${.2+Math.sin(t*.9)*.07})`);ig.addColorStop(.3,`rgba(220,140,20,.1)`);ig.addColorStop(1,'transparent');
  ctx.save();ctx.globalCompositeOperation='screen';ctx.fillStyle=ig;archPath(cx,cy,GW-4,GH-4);ctx.fill();ctx.restore();
  // frame
  ctx.save();ctx.shadowBlur=50;ctx.shadowColor='#b06010';
  const fg=ctx.createLinearGradient(cx-GW/2,cy-GH/2,cx+GW/2,cy+GH/2);
  fg.addColorStop(0,'#fff8c0');fg.addColorStop(.25,'#e8b020');fg.addColorStop(.55,'#b06818');fg.addColorStop(.85,'#6a3c08');fg.addColorStop(1,'#2a1000');
  ctx.strokeStyle=fg;ctx.lineWidth=4;archPath(cx,cy,GW,GH);ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle=`rgba(230,170,50,${.35+Math.sin(t*.4)*.1})`;ctx.lineWidth=1.5;archPath(cx,cy,GW-16,GH-12);ctx.stroke();ctx.restore();
  // orbs
  [[cx-GW*.38,cy-GH*.3],[cx+GW*.38,cy-GH*.3],[cx-GW*.42,cy+GH*.05],[cx+GW*.42,cy+GH*.05],[cx,cy-GH*.45]].forEach(([ox,oy],i)=>{
    const pulse=Math.sin(t*1.8+i*1.2)*.5+.5;
    ctx.save();ctx.shadowBlur=20+pulse*25;ctx.shadowColor=i===4?'#fff8d0':'#f0a020';
    const og=ctx.createRadialGradient(ox,oy,0,ox,oy,8+pulse*5);
    og.addColorStop(0,`rgba(255,240,150,${.8+pulse*.2})`);og.addColorStop(.5,`rgba(220,130,20,${.4+pulse*.2})`);og.addColorStop(1,'transparent');
    ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,8+pulse*5,0,6.28);ctx.fill();ctx.restore();
  });
  // spirals
  for(let side of[-1,1]){
    const sx=cx+side*(GW*.32),sy=cy,sr=GW*.12;
    ctx.save();ctx.globalAlpha=.22+Math.sin(t*.4+side)*.07;ctx.strokeStyle='rgba(220,160,40,.7)';ctx.lineWidth=.8;
    ctx.beginPath();
    for(let a=0;a<18.84;a+=.12){const rr=a/18.84*sr;ctx.lineTo(sx+Math.cos(a+t*.1*side)*rr,sy+Math.sin(a+t*.1*side)*rr)}
    ctx.stroke();ctx.restore();
  }
  // glyphs
  ['☽','✦','⊕','⋈','⟁','⊛','✧','⊗'].forEach((g,i)=>{
    const gx=cx+Math.cos(i/8*6.28)*GW*.52,gy=cy-GH*.05+Math.sin(i/8*6.28)*GH*.46;
    ctx.save();ctx.globalAlpha=.2+Math.sin(t*.7+i)*.12;ctx.fillStyle=`hsl(${38+i*8},85%,65%)`;
    ctx.font=`${GW*.04}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=10;ctx.shadowColor='#d09020';ctx.fillText(g,gx,gy);ctx.restore();
  });
  // sun
  const pulse=Math.sin(t*1.3)*.5+.5,sy=cy-GH/2-GH*.05;
  for(let i=3;i>0;i--){ctx.save();ctx.globalAlpha=.05*i;ctx.strokeStyle='rgba(255,220,80,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,sy,GW*.08*i*.5+pulse*3,0,6.28);ctx.stroke();ctx.restore()}
  const cg=ctx.createRadialGradient(cx,sy,0,cx,sy,GW*.09+pulse*5);
  cg.addColorStop(0,`rgba(255,255,220,${.9+pulse*.1})`);cg.addColorStop(.3,`rgba(255,200,50,.6)`);cg.addColorStop(1,'transparent');
  ctx.save();ctx.shadowBlur=35+pulse*20;ctx.shadowColor='#ffdd50';ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,sy,GW*.09+pulse*5,0,6.28);ctx.fill();
  for(let i=0;i<24;i++){const ra=i/24*6.28+t*.04,r1=GW*.1,r2=GW*(.13+i%2*.06);ctx.globalAlpha=.3+Math.sin(t*.8+i)*.12;ctx.strokeStyle='rgba(255,200,50,.7)';ctx.lineWidth=i%3===0?1.5:.6;ctx.beginPath();ctx.moveTo(cx+Math.cos(ra)*r1,sy+Math.sin(ra)*r1);ctx.lineTo(cx+Math.cos(ra)*r2,sy+Math.sin(ra)*r2);ctx.stroke()}
  ctx.restore();
  // fires
  for(let side of[-1,1]){
    const fx=cx+side*(GW/2+GW*.1),fy=cy+GH*.35;
    ctx.save();ctx.fillStyle='rgba(140,80,8,.55)';ctx.fillRect(fx-GW*.04,fy,GW*.08,GH*.08);ctx.restore();
    for(let fi=0;fi<14;fi++){
      const fa=t*3+fi*.55+side*1.2,ffx=fx+Math.sin(fa)*4.5,ffy=fy-fi*8-Math.abs(Math.sin(fa))*5,ffs=(14-fi)*2.5;
      const fc=fi<3?'#fff8d0':fi<6?'#f0c040':fi<9?'#e08010':'#b03000';
      ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=(1-fi/14)*.75;ctx.shadowBlur=14;ctx.shadowColor=fc;ctx.fillStyle=fc;ctx.beginPath();ctx.arc(ffx,ffy,ffs,0,6.28);ctx.fill();ctx.restore();
    }
  }
  // ground + fog
  const pw=GW*1.9,pg=ctx.createLinearGradient(cx-pw/2,cy+GH/2,cx+pw/2,cy+GH/2);
  pg.addColorStop(0,'transparent');pg.addColorStop(.5,`rgba(255,180,40,${.45+Math.sin(t*.4)*.1})`);pg.addColorStop(1,'transparent');
  ctx.fillStyle=pg;ctx.fillRect(cx-pw/2,cy+GH/2,pw,5);
  const fog=ctx.createLinearGradient(0,cy+GH/2,0,H);
  fog.addColorStop(0,'transparent');fog.addColorStop(.35,`rgba(100,55,8,.14)`);fog.addColorStop(1,'rgba(40,18,3,.5)');
  ctx.fillStyle=fog;ctx.fillRect(0,cy+GH/2,W,H);
  ctx.save();ctx.globalCompositeOperation='screen';
  const lc=ctx.createLinearGradient(cx,cy+GH/2,cx,cy-GH*1.3);
  lc.addColorStop(0,`rgba(255,200,60,${.06+Math.sin(t*.7)*.025})`);lc.addColorStop(1,'transparent');
  ctx.fillStyle=lc;ctx.fillRect(cx-GW*.38,cy-GH*1.3,GW*.76,GH*1.8);ctx.restore();
}
function loop(ts){if(!t0)t0=ts;const t=(ts-t0)/1000;ctx.clearRect(0,0,W,H);sky(t);drawStars(t);drawGate(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.getElementById('btn').addEventListener('click',()=>{const fl=document.getElementById('flash');fl.style.opacity='1';setTimeout(()=>fl.style.opacity='0',700)});
</script>
</body>
</html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پرداخت ANIL X</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090806;color:#f7f0df;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}.box{width:min(92%,560px);padding:32px;border:1px solid #3d3424;border-radius:24px;background:#12100c;text-align:center;box-shadow:0 20px 80px #0008}h1{margin-top:0;color:#d8b45a}.muted{color:#b8ad99;line-height:1.9}.wallet{margin:22px auto;padding:18px;border:1px solid #3d3424;border-radius:18px;background:#0d0b08}.wallet-status{margin-top:12px;color:#b8ad99;font-size:13px;direction:ltr;word-break:break-all}.connect-btn{display:inline-block;margin-top:8px;padding:14px 24px;border-radius:14px;background:#d8b45a;color:#17130b;font-weight:800;border:0;font-size:16px;cursor:pointer}.btn{display:inline-block;margin-top:20px;padding:14px 22px;border-radius:14px;background:#d8b45a;color:#17130b;text-decoration:none;font-weight:800;border:0}</style><script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script></head><body><main class="box"><h1>پرداخت ANIL X</h1><p class="muted" id="status">درگاه پرداخت آماده است.</p><section class="wallet"><strong>کیف پول TON</strong><button id="ton-connect-fallback" class="connect-btn" type="button">اتصال کیف پول TON</button><div id="ton-wallet-status" class="wallet-status">در حال آماده‌سازی اتصال…</div></section><div id="actions"></div></main><script>(function(){'use strict';const MANIFEST='https://saberbadri24-tech.github.io/city-of-eternity/tonconnect-manifest.json';const b=document.getElementById('ton-connect-fallback'),o=document.getElementById('ton-wallet-status');function boot(){if(!window.TON_CONNECT_UI||!window.TON_CONNECT_UI.TonConnectUI)return false;try{const ui=new window.TON_CONNECT_UI.TonConnectUI({manifestUrl:MANIFEST});window.anilXTonConnect=ui;b.onclick=async()=>{try{await ui.openModal()}catch(e){console.error(e);o.textContent='خطا در باز کردن کیف پول'}};ui.onStatusChange(w=>{const a=w&&w.account&&w.account.address||'';o.textContent=a?'TON وصل شد · '+a.slice(0,6)+'…'+a.slice(-6):'کیف پول TON وصل نیست';b.textContent=a?'کیف پول TON متصل است':'اتصال کیف پول TON'});o.textContent='کیف پول TON وصل نیست';return true}catch(e){console.error(e);o.textContent='خطای راه‌اندازی TON Connect';return false}}if(!boot())window.addEventListener('load',boot,{once:true})})();</script><script>const q=new URLSearchParams(location.search),amount=q.get('amount'),order=q.get('order'),s=document.querySelector('#status'),a=document.querySelector('#actions');if(amount){s.textContent='در حال آماده‌سازی پرداخت…';fetch('/api/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount,orderId:order||undefined,client:q.get('client')||'مشتری ANIL X',description:q.get('description')||'پرداخت ANIL X'})}).then(r=>r.json()).then(x=>{if(!x.ok)throw new Error(x.error||'payment_error');s.textContent='لینک پرداخت آماده است.';a.innerHTML='<a class="btn" href="'+x.payUrl+'">ادامه پرداخت</a>'}).catch(e=>{s.textContent='ساخت پرداخت انجام نشد: '+e.message})}</script></body></html>

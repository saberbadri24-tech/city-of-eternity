<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پرداخت ANIL X</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090806;color:#f7f0df;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}.box{width:min(92%,560px);padding:32px;border:1px solid #3d3424;border-radius:24px;background:#12100c;text-align:center;box-shadow:0 20px 80px #0008}h1{margin-top:0;color:#d8b45a}.muted{color:#b8ad99;line-height:1.9}.wallet{margin:22px auto;padding:18px;border:1px solid #3d3424;border-radius:18px;background:#0d0b08}.wallet-status{margin-top:12px;color:#b8ad99;font-size:13px;direction:ltr;word-break:break-all}.connect-btn,.pay-btn{display:inline-block;margin-top:8px;padding:14px 24px;border-radius:14px;background:#d8b45a;color:#17130b;font-weight:800;border:0;font-size:16px;cursor:pointer}.pay-btn{margin-top:16px;width:90%}.amount{font-size:28px;font-weight:900;color:#d8b45a;margin:16px}.small{font-size:12px;color:#8f8574;line-height:1.8}</style><script src="https://unpkg.com/@tonconnect/ui@3.0.2/dist/tonconnect-ui.min.js"></script></head><body><main class="box"><h1>پرداخت ANIL X</h1><p class="muted" id="status">درگاه TON آماده است.</p><section class="wallet"><strong>کیف پول TON</strong><button id="ton-connect" class="connect-btn" type="button">اتصال کیف پول TON</button><div id="ton-wallet-status" class="wallet-status">کیف پول TON وصل نیست</div></section><div id="paymentBox"></div><div id="varizaBox" style="margin-top:12px"></div><p class="small">پرداخت مستقیماً به کیف پول مقصد ANIL X ارسال می‌شود. کلید خصوصی یا عبارت بازیابی هرگز دریافت نمی‌شود.</p></main><script>(function(){'use strict';const MANIFEST=location.hostname.endsWith('onrender.com')?location.origin+'/render-tonconnect-manifest.json':'https://saberbadri24-tech.github.io/city-of-eternity/tonconnect-manifest.json';let DEST='UQA-G0xsCW5MaWtE4JC16Y2Mj_y6u9f6MHOSK2UDgJ5N6ciW';const API='https://city-of-eternity.onrender.com';const b=document.getElementById('ton-connect'),o=document.getElementById('ton-wallet-status'),s=document.getElementById('status'),box=document.getElementById('paymentBox');const q=new URLSearchParams(location.search);const ton=Number(q.get('ton')||''),orderId=String(q.get('order')||''),amount=Number(q.get('amount')||'');let ui=null,varizaBox=document.getElementById('varizaBox');function render(){if(!ton||!Number.isFinite(ton)||ton<=0){box.innerHTML='<div class="amount">مبلغ پرداخت مشخص نشده</div>';return}box.innerHTML='<div class="amount">'+ton.toFixed(4)+' TON</div><button id="payTon" class="pay-btn" type="button">پرداخت با TON</button>' ;document.getElementById('payTon').onclick=async()=>{if(!ui){s.textContent='ابتدا کیف پول را وصل کن.';return}try{const nano=String(Math.round(ton*1e9));await ui.sendTransaction({validUntil:Math.floor(Date.now()/1000)+600,messages:[{address:DEST,amount:nano}]});s.textContent='درخواست پرداخت به کیف پول ارسال شد.'}catch(e){console.error(e);s.textContent='پرداخت لغو شد یا کیف پول پاسخ نداد.'}}}async function renderVariza(){if(!varizaBox||!Number.isFinite(amount)||amount<1000)return;varizaBox.innerHTML='<button id="payVariza" class="pay-btn" type="button">پرداخت با کارت · '+Math.round(amount).toLocaleString('fa-IR')+' تومان</button>';document.getElementById('payVariza').onclick=async()=>{try{const r=await fetch(API+'/api/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount,orderId:orderId||undefined,description:'پرداخت ANIL X'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'خطای ساخت پرداخت');location.href=d.payUrl}catch(e){s.textContent='ساخت لینک پرداخت انجام نشد: '+(e.message||'خطا')}};if(orderId){try{const r=await fetch(API+'/api/payment-status?orderId='+encodeURIComponent(orderId),{cache:'no-store'});if(r.ok){const d=await r.json();if(d.status==='paid')s.textContent='پرداخت با موفقیت تأیید شد ✓';}}catch{}}}
async function loadPaymentConfig(){try{const r=await fetch(API+'/api/payment-config',{cache:'no-store'});const d=await r.json();DEST=String(d?.ton?.address||'');return !!DEST}catch{return false}}async function boot(){if(!window.TON_CONNECT_UI||!window.TON_CONNECT_UI.TonConnectUI)return false;await loadPaymentConfig();try{ui=new window.TON_CONNECT_UI.TonConnectUI({manifestUrl:MANIFEST});window.anilXTonConnect=ui;b.onclick=async()=>{try{await ui.openModal()}catch(e){console.error(e)}};ui.onStatusChange(w=>{const a=w&&w.account&&w.account.address||'';o.textContent=a?'TON وصل شد · '+a.slice(0,6)+'…'+a.slice(-6):'کیف پول TON وصل نیست';b.textContent=a?'کیف پول TON متصل است':'اتصال کیف پول TON'});render();return true}catch(e){console.error(e);s.textContent='خطای راه‌اندازی TON Connect';return false}}renderVariza();if(!boot())window.addEventListener('load',boot,{once:true})})();</script></body></html>

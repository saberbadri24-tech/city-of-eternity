<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پرداخت ANIL X</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090806;color:#f7f0df;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}.box{width:min(92%,520px);padding:32px;border:1px solid #3d3424;border-radius:24px;background:#12100c;text-align:center;box-shadow:0 20px 80px #0008}h1{margin-top:0;color:#d8b45a}.muted{color:#b8ad99;line-height:1.9}.btn{display:inline-block;margin-top:20px;padding:14px 22px;border-radius:14px;background:#d8b45a;color:#17130b;text-decoration:none;font-weight:800}.status{margin-top:18px}</style></head><body><main class="box"><h1>پرداخت ANIL X</h1><p class="muted" id="status">در حال آماده‌سازی پرداخت…</p><div id="actions"></div></main><script>const q=new URLSearchParams(location.search),amount=q.get('amount'),order=q.get('order');const s=document.querySelector('#status'),a=document.querySelector('#actions');if(amount){s.textContent='در حال ساخت لینک پرداخت امن…';fetch('/api/pay',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount,orderId:order||undefined,client:q.get('client')||'مشتری ANIL X',description:q.get('description')||'پرداخت ANIL X'})}).then(r=>r.json()).then(x=>{if(!x.ok)throw new Error(x.error||'payment_error');s.textContent='لینک پرداخت آماده است.';a.innerHTML='<a class="btn" href="'+x.payUrl+'">ادامه پرداخت</a>'}).catch(e=>{s.textContent='ساخت پرداخت انجام نشد: '+e.message})}else{s.textContent='اگر پرداخت را انجام داده‌ای، وضعیت آن از طریق واریزا به‌صورت خودکار تأیید می‌شود.'}</script></body></html>

dius:14px;background:#d9c48a;color:#111;padding:12px 18px;font-weight:800;cursor:pointer}.send:disabled{opacity:.45}.tools{max-width:900px;margin:8px auto 0;display:flex;justify-content:space-between;padding:0 4px;color:#727d90;font-size:12px}.tools button{background:none;border:0;color:#8993a3;cursor:pointer}.login{position:fixed;inset:0;background:#080b12eF;display:grid;place-items:center;padding:20px;z-index:20}.login-card{width:min(420px,100%);background:#10151f;border:1px solid #343c4b;border-radius:24px;padding:26px;box-shadow:0 25px 80px #000b}.login-card h2{margin-top:0}.login-card p{color:#8f99a9;line-height:1.8;font-size:14px}.login-card input{width:100%;margin:7px 0;padding:13px 14px;border-radius:12px;border:1px solid #343c4b;background:#0b0f17;color:#fff;outline:0}.login-card button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;background:#d9c48a;color:#111;font-weight:800}.error{color:#ff8d8d;font-size:13px;min-height:22px}.hidden{display:none!important}@media(max-width:600px){.msg{max-width:92%}.chat{padding-top:10px}.welcome{padding:38px 8px 20px}}</style></head><body><div class="app"><header class="top"><a class="brand" href="index.html"><b>X</b>ANIL X</a><a href="index.html">بازگشت به سایت</a></header><main class="chat"><section id="welcome" class="welcome"><div class="crown">♛</div><h1>سلام مدیر صابر</h1><p>من آنیل هستم. بگو چه می‌خواهی؛ بررسی می‌کنم، ابزار لازم را انتخاب می‌کنم، کارهای مجاز را انجام می‌دهم و نتیجه واقعی را گزارش می‌کنم.</p></section><section id="messages" class="messages" aria-live="polite"></section></main><div class="composer"><div class="composer-inner"><textarea id="input" rows="1" placeholder="مثلاً: وضعیت سایت را بررسی کن و هر چیزی که لازم است اصلاح شود انجام بده…"></textarea><button id="send" class="send">ارسال</button></div><div class="tools"><span id="status">آماده</span><button id="clear">پاک کردن گفتگو</button></div></div></div><div id="login" class="login"><section class="login-card"><h2>ورود مدیر ANIL X</h2><p>ورود فقط برای مدیر است. دو رمز در سمت سرور بررسی می‌شوند و رمزها داخل مرورگر یا چت ذخیره نمی‌شوند.</p><input id="p1" type="password" autocomplete="current-password" placeholder="رمز مدیر ۱"><input id="p2" type="password" autocomplete="current-password" placeholder="رمز مدیر ۲"><div id="loginError" class="error"></div><button id="loginBtn">ورود به آنیل</button></section></div><script src="admin.js?v=20260918-chat" defer></script></body></html>
